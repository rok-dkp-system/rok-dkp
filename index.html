<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROK Alliance DKP Board</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            /* 눈이 편안한 저채도 다크 테마 색상 */
            --bg-color: #1a1c22;        /* 깊은 다크 그레이 */
            --card-bg: #24272e;        /* 카드 배경 */
            --header-bg: #2d323a;      /* 헤더 배경 */
            --text-main: #e0e0e0;      /* 주 텍스트 (순백색 지양) */
            --text-dim: #a0a5ad;       /* 보조 텍스트 */
            --border-color: #383e47;   /* 경계선 */
            --accent-gold: #d4af37;    /* DKP 강조 (톤다운된 골드) */
            --accent-green: #52a447;   /* 달성률 (차분한 초록) */
            --progress-bg: #16181d;    /* 게이지 배경 */
        }
        
        body { 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0;
        }

        h2 { color: var(--text-main); margin-bottom: 30px; font-size: 24px; letter-spacing: -0.5px; }

        .search-container {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #searchInput {
            width: 100%;
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: border 0.3s;
        }
        #searchInput:focus { outline: none; border-color: #5d6d7e; }

        .btn-group-main, .btn-group-sub { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-group-main { margin-bottom: 8px; }

        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover { background: var(--header-bg); color: var(--text-main); }
        .btn-active-dkp { border-color: var(--accent-gold); color: var(--accent-gold); }

        table { 
            width: 100%; 
            max-width: 1100px; 
            border-collapse: collapse; 
            background: var(--card-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        th { 
            background-color: var(--header-bg); 
            color: var(--text-dim); 
            padding: 18px; 
            font-size: 13px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }
        td { padding: 16px; border-bottom: 1px solid var(--border-color); text-align: center; font-size: 14px; }
        tr:hover { background-color: rgba(255,255,255,0.02); }
        
        /* 게이지 바 디자인 */
        .progress-container {
            width: 120px;
            background-color: var(--progress-bg);
            border-radius: 10px;
            margin: 0 auto;
            position: relative;
            height: 18px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3d8c34, var(--accent-green));
            width: 0%;
            transition: width 0.8s ease-in-out;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            font-size: 10px;
            line-height: 18px;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .dkp-highlight { color: var(--accent-gold) !important; font-weight: 700; }
        .loading { margin-top: 50px; color: var(--text-dim); font-size: 16px; }
        .user-name-col { font-weight: 600; color: #fff; } 
        .user-id-col { color: var(--text-dim); font-size: 11px; } 
    </style>
</head>
<body>

    <h2>🛡️ Alliance DKP Leaderboard</h2>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Enter Username or User ID...">
        
        <div class="btn-group-main">
            <button onclick="sortBy('dkp')" class="btn-active-dkp">🚀 Sort by Total DKP</button>
            <button onclick="sortBy('percent')">📊 Sort by Progress</button>
        </div>

        <div class="btn-group-sub">
            <button onclick="sortBy('t4')">T4 Kills ↕</button>
            <button onclick="sortBy('t5')">T5 Kills ↕</button>
            <button onclick="sortBy('dead')">Dead ↕</button>
        </div>
    </div>
    
    <table id="dkpTable">
        <thead>
            <tr>
                <th style="width: 50px;">Rank</th>
                <th>Username</th>
                <th style="width: 100px;">ID</th>
                <th style="width: 140px;">Progress</th>
                <th>T4 Kills</th>
                <th>T5 Kills</th>
                <th>Total Dead</th>
                <th>Total DKP</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div id="loader" class="loading">
        🔄 Loading data from Google Sheets...
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRd8sijeP2d8lwtLT9vbkVZN3ZwZ31saToMee7VGPjnNn5D_hefOr0yEKsNCc5886ntTXrI8-3Jmb6F/pub?gid=0&single=true&output=csv';
        
        let allData = [];      
        let currentData = [];  
        let sortStatus = { percent: 1, dkp: 1, t4: 1, t5: 1, dead: 1 }; 
        // 해당 부분 수정시 dkp 요구치 변경 가능
        const goalMultiplier = 0.5; 
        const weights = { t4: 4, t5: 5, dead: 10 };

        function parseNum(val) {
            if (!val) return 0;
            return parseFloat(val.toString().replace(/,/g, '').trim()) || 0;
        }

        function formatNumber(num) {
            return Math.floor(num).toLocaleString();
        }

        function loadData() {
            Papa.parse(sheetUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allData = results.data.map(row => {
                        const name = row['캐릭터 닉네임'] || 'Unknown';
                        const id = row['캐릭터ID'] || '';
                        const t4 = parseNum(row['누적 T4']);
                        const t5 = parseNum(row['누적 T5']);
                        const dead = parseNum(row['누적 T4사망']) + parseNum(row['누적 T5사망']);
                        const basePower = parseNum(row['기준 전투력']);
                        
                        const dkp = (t4 * weights.t4) + (t5 * weights.t5) + (dead * weights.dead);
                        const goal = basePower * goalMultiplier || 1; 
                        
                        return {
                            name: name, id: id, dkp: dkp,
                            percent: (dkp / goal * 100),
                            t4: t4, t5: t5, dead: dead, goal: goal
                        };
                    }).filter(item => item.id !== "");

                    currentData = [...allData];
                    
                    // 핵심 수정: 첫 로딩 시 DKP 높은 순으로 정렬 (내림차순)
                    sortStatus.dkp = -1; 
                    sortBy('dkp');
                    
                    document.getElementById('loader').style.display = 'none';
                }
            });
        }

        function sortBy(column) {
            // 버튼 강조 스타일 초기화 및 적용 (선택 사항)
            sortStatus[column] *= -1;
            const dir = sortStatus[column];

            currentData.sort((a, b) => {
                const valA = a[column] || 0;
                const valB = b[column] || 0;
                return (valA < valB ? -1 : valA > valB ? 1 : 0) * dir;
            });

            displayData(currentData);
        }

        function displayData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                let displayPercent = Math.min(item.percent, 100);
                
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="user-name-col">${item.name}</td>
                    <td class="user-id-col">${item.id}</td>
                    <td>
                        <div class="progress-container" title="Target: ${formatNumber(item.goal)}">
                            <div class="progress-bar" style="width: ${displayPercent}%"></div>
                            <div class="progress-text">${item.percent.toFixed(1)}%</div>
                        </div>
                    </td>
                    <td>${formatNumber(item.t4)}</td>
                    <td>${formatNumber(item.t5)}</td>
                    <td>${formatNumber(item.dead)}</td>
                    <td class="dkp-highlight">${formatNumber(item.dkp)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            currentData = allData.filter(item => 
                item.id.toString().toLowerCase().includes(term) || 
                item.name.toLowerCase().includes(term)
            );
            displayData(currentData);
        }

        window.onload = loadData;
    </script>
</body>
</html>
