<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROK Alliance DKP Board</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --bg-color: #121418;
            --card-bg: #1c1f26;
            --header-bg: #252a33;
            --text-main: #cfd4da;
            --text-dim: #8a919b;
            --border-color: #2d333d;
            --accent-gold: #c9a55c;
            --accent-green: #4e8c46;
            --progress-bg: #0f1114;
        }
        
        body { 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0;
        }

        h2 { color: var(--text-main); margin-bottom: 30px; font-weight: 500; }

        .search-container {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #searchInput {
            width: 100%;
            padding: 14px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        button {
            padding: 10px 18px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        button:hover { background: var(--header-bg); color: var(--text-main); }
        .active { border-color: var(--accent-gold); color: var(--accent-gold); }

        table { 
            width: 100%; 
            max-width: 1100px; 
            border-collapse: collapse; 
            background: var(--card-bg); 
            border-radius: 10px; 
            overflow: hidden; 
        }
        th { 
            background-color: var(--header-bg); 
            color: var(--text-dim); 
            padding: 15px; 
            font-size: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        td { padding: 15px; border-bottom: 1px solid var(--border-color); text-align: center; font-size: 14px; }
        
        .progress-container {
            width: 110px;
            background-color: var(--progress-bg);
            border-radius: 10px;
            margin: 0 auto;
            position: relative;
            height: 16px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.6s ease;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            top: 0;
            font-size: 10px;
            line-height: 16px;
            color: #fff;
            font-weight: bold;
        }

        .dkp-highlight { color: var(--accent-gold) !important; font-weight: bold; }
        .loading { margin-top: 50px; color: var(--text-dim); }
        .user-id-col { color: var(--text-dim); font-size: 11px; } 
    </style>
</head>
<body>

    <h2>🛡️ Alliance DKP Leaderboard</h2>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Enter Username or User ID...">
        
        <div class="btn-group">
            <button id="btn-dkp" class="active" onclick="handleSort('dkp')">🚀 Total DKP Rank</button>
            <button id="btn-percent" onclick="handleSort('percent')">📊 Progress Rank</button>
            <button onclick="handleSort('t4')">T4 ↕</button>
            <button onclick="handleSort('t5')">T5 ↕</button>
            <button onclick="handleSort('dead')">Dead ↕</button>
        </div>
    </div>
    
    <table id="dkpTable">
        <thead>
            <tr>
                <th style="width: 50px;">Rank</th>
                <th>Username</th>
                <th style="width: 100px;">ID</th>
                <th style="width: 130px;">Progress</th>
                <th>T4 Kills</th>
                <th>T5 Kills</th>
                <th>Total Dead</th>
                <th>Total DKP</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div id="loader" class="loading">🔄 Synchronizing...</div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRd8sijeP2d8lwtLT9vbkVZN3ZwZ31saToMee7VGPjnNn5D_hefOr0yEKsNCc5886ntTXrI8-3Jmb6F/pub?gid=0&single=true&output=csv';
        
        let allData = [];      
        let currentData = [];  
        let currentSortColumn = 'dkp';
        let sortDirection = -1; // -1은 내림차순(높은 순)

        const weights = { t4: 1, t5: 4, dead: 10 };
        const goalMultiplier = 0.5;

        function parseNum(val) {
            return parseFloat(val?.toString().replace(/,/g, '').trim()) || 0;
        }

        function loadData() {
            Papa.parse(sheetUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allData = results.data.map(row => {
                        const t4 = parseNum(row['누적 T4']);
                        const t5 = parseNum(row['누적 T5']);
                        const dead = parseNum(row['누적 T4사망']) + parseNum(row['누적 T5사망']);
                        const pwr = parseNum(row['기준 전투력']);
                        const dkp = (t4 * weights.t4) + (t5 * weights.t5) + (dead * weights.dead);
                        const goal = pwr * goalMultiplier || 1;
                        
                        return {
                            name: row['캐릭터 닉네임'] || 'Unknown',
                            id: row['캐릭터ID'] || '',
                            dkp: dkp,
                            percent: (dkp / goal * 100),
                            t4: t4, t5: t5, dead: dead, goal: goal
                        };
                    }).filter(item => item.id !== "");

                    currentData = [...allData];
                    
                    // [변경] 초기 로딩 시 무조건 DKP 높은 순 정렬
                    currentData.sort((a, b) => b.dkp - a.dkp);
                    sortDirection = -1; 
                    currentSortColumn = 'dkp';

                    displayData(currentData);
                    document.getElementById('loader').style.display = 'none';
                }
            });
        }

        function handleSort(column) {
            // 같은 컬럼 클릭 시 방향 전환, 다른 컬럼 클릭 시 내림차순(높은순)으로 초기화
            if (currentSortColumn === column) {
                sortDirection *= -1;
            } else {
                currentSortColumn = column;
                sortDirection = -1; 
            }
            
            currentData.sort((a, b) => {
                const valA = a[column];
                const valB = b[column];
                return (valA < valB ? -1 : valA > valB ? 1 : 0) * sortDirection;
            });

            // 버튼 UI 상태 변경
            document.querySelectorAll('.btn-group button').forEach(btn => btn.classList.remove('active'));
            if(column === 'dkp' || column === 'percent') {
                const targetBtn = column === 'dkp' ? document.getElementById('btn-dkp') : document.getElementById('btn-percent');
                if(targetBtn) targetBtn.classList.add('active');
            }

            displayData(currentData);
        }

        function displayData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                const displayPercent = Math.min(item.percent, 100);
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td style="font-weight:600; color:#fff;">${item.name}</td>
                    <td class="user-id-col">${item.id}</td>
                    <td>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${displayPercent}%"></div>
                            <div class="progress-text">${item.percent.toFixed(1)}%</div>
                        </div>
                    </td>
                    <td>${item.t4.toLocaleString()}</td>
                    <td>${item.t5.toLocaleString()}</td>
                    <td>${item.dead.toLocaleString()}</td>
                    <td class="dkp-highlight">${Math.floor(item.dkp).toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allData.filter(item => 
                item.id.toString().includes(term) || item.name.toLowerCase().includes(term)
            );
            // 검색 결과도 현재 정렬 기준 유지
            filtered.sort((a, b) => {
                const valA = a[currentSortColumn];
                const valB = b[currentSortColumn];
                return (valA < valB ? -1 : valA > valB ? 1 : 0) * sortDirection;
            });
            displayData(filtered);
        }

        window.onload = loadData;
    </script>
</body>
</html>
