<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROK DKP 랭킹 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --primary-color: #ffaa55; 
            --highlight-color: #ff6677; 
            --text-color: #d0d0d0; 
            --bg-color: #0c0e11; 
            --card-bg: #16191f; 
            --header-bg: #1f2329; 
            --border-color: #2e353f; 
            --progress-bg: #2e353f; 
            --progress-fill: #3498db; 
        }
        body { 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        h2 { color: #d0d0d0; margin-bottom: 30px; font-size: 26px; }

        .search-container {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        #searchInput {
            width: 100%;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: white;
            font-size: 17px;
            box-sizing: border-box;
        }
        #searchInput:focus { outline: 2px solid #3498db; }

        .btn-group-main { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
        .btn-group-sub { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }

        table { 
            width: 100%; 
            max-width: 1100px; 
            border-collapse: collapse; 
            background: var(--card-bg); 
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
        }
        th { 
            background-color: var(--header-bg); 
            color: #909090; 
            padding: 22px 18px; 
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }
        td { padding: 20px; border-bottom: 1px solid var(--border-color); text-align: center; font-size: 15px; }
        tr:hover { background-color: rgba(255,255,255,0.03); }
        
        .progress-container {
            width: 130px;
            background-color: var(--progress-bg);
            border-radius: 15px;
            margin: 0 auto;
            position: relative;
            height: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #2980b9, #3498db) !important;
            width: 0%;
            transition: width 0.7s ease-out;
            border-radius: 15px;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            font-size: 12px;
            line-height: 20px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .dkp-highlight { color: #e67e22 !important; font-weight: 700; font-size: 16px; }
        .loading { margin-top: 60px; color: #606060; font-size: 18px; }
        .user-name-col { font-weight: 700; color: #e0e0e0; font-size: 16px; } 
        .user-id-col { color: #606060; font-size: 13px; } 
    </style>
</head>
<body>

    <h2>🛡️ 연맹 DKP 랭킹 보드</h2>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterData()" placeholder="유저명 또는 User ID를 입력하세요...">
        
        <div class="btn-group-main">
            <button onclick="sortBy('percent')" style="padding: 12px 24px; border-radius: 10px; border: 1px solid #3498db; background: var(--card-bg); color: #3498db; cursor: pointer; font-weight: bold;">📊 달성률 정렬</button>
            <button onclick="sortBy('dkp')" style="padding: 12px 24px; border-radius: 10px; border: 1px solid #e67e22; background: var(--card-bg); color: #e67e22; cursor: pointer; font-weight: bold;">🚀 총 DKP 정렬</button>
        </div>

        <div class="btn-group-sub">
            <button onclick="sortBy('t4')" style="padding: 5px 12px; border-radius: 6px; border: 1px solid #95a5a6; background: transparent; color: #95a5a6; cursor: pointer; font-size: 12px;">T4 정렬 ↕</button>
            <button onclick="sortBy('t5')" style="padding: 5px 12px; border-radius: 6px; border: 1px solid #95a5a6; background: transparent; color: #95a5a6; cursor: pointer; font-size: 12px;">T5 정렬 ↕</button>
            <button onclick="sortBy('dead')" style="padding: 5px 12px; border-radius: 6px; border: 1px solid #95a5a6; background: transparent; color: #95a5a6; cursor: pointer; font-size: 12px;">데스 정렬 ↕</button>
        </div>
    </div>
    
    <table id="dkpTable">
        <thead>
            <tr>
                <th style="width: 70px;">순위</th>
                <th>유저명</th>
                <th style="width: 120px;">ID</th>
                <th style="width: 160px;">목표 달성률</th>
                <th>T4 킬</th>
                <th>T5 킬</th>
                <th>데스</th>
                <th>총 DKP</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div id="loader" class="loading">
        🔄 데이터를 로딩 중... 잠시만 기다려주세요.
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRd8sijeP2d8lwtLT9vbkVZN3ZwZ31saToMee7VGPjnNn5D_hefOr0yEKsNCc5886ntTXrI8-3Jmb6F/pub?gid=0&single=true&output=csv';
        
        let allData = [];      
        let currentData = [];  
        let sortStatus = { percent: 1, dkp: 1, t4: 1, t5: 1, dead: 1 }; 

        const goalMultiplier = 2; 
        const weights = { t4: 1, t5: 4, dead: 10 };

        function formatNumber(num) {
            return Number(num || 0).toLocaleString();
        }

        function loadData() {
            Papa.parse(sheetUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allData = results.data.map(row => {
                        // test.csv의 실제 헤더 명칭으로 매핑
                        const pwr = parseFloat(row['현재 전투력'] || 0);
                        const t4 = parseFloat(row['총 T4 처치'] || 0);
                        const t5 = parseFloat(row['총 T5 처치'] || 0);
                        // T4 사망 + T5 사망 합산
                        const d = parseFloat(row['T4 사망'] || 0) + parseFloat(row['T5 사망'] || 0);
                        
                        const dkp = (t4 * weights.t4) + (t5 * weights.t5) + (d * weights.dead);
                        const goal = pwr * goalMultiplier || 0.5; // 해당부분 숫자 변경시 dkp 요구수치 변경
                        
                        return {
                            name: row['캐릭터 닉네임'] || '',
                            id: row['캐릭터ID'] || '',
                            dkp: dkp,
                            percent: (dkp / goal * 100),
                            t4: t4, t5: t5, dead: d, goal: goal
                        };
                    }).filter(item => item.name !== "");

                    currentData = [...allData];
                    sortBy('percent'); // 최초 로드 시 달성률 높은 순
                }
            });
        }

        function sortBy(column) {
            sortStatus[column] *= -1;
            const dir = sortStatus[column];

            currentData.sort((a, b) => {
                const valA = a[column] || 0;
                const valB = b[column] || 0;
                return (valA < valB ? -1 : valA > valB ? 1 : 0) * dir;
            });

            displayData(currentData);
        }

        function displayData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const fragment = document.createDocumentFragment();

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                let displayPercent = Math.min(item.percent, 100);
                
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="user-name-col">${item.name}</td>
                    <td class="user-id-col">${item.id}</td>
                    <td>
                        <div class="progress-container" title="목표 DKP: ${formatNumber(item.goal)}">
                            <div class="progress-bar" style="width: ${displayPercent}%"></div>
                            <div class="progress-text">${item.percent.toFixed(1)}%</div>
                        </div>
                    </td>
                    <td>${formatNumber(item.t4)}</td>
                    <td>${formatNumber(item.t5)}</td>
                    <td>${formatNumber(item.dead)}</td>
                    <td class="dkp-highlight">${formatNumber(item.dkp)}</td>
                `;
                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);
            document.querySelector('#loader').style.display = 'none';
        }

        function filterData() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            currentData = allData.filter(item => 
                item.id.toString().toLowerCase().includes(term) || 
                item.name.toLowerCase().includes(term)
            );
            displayData(currentData);
        }

        window.onload = loadData;
    </script>
</body>
</html>
